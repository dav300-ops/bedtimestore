<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4a0808"/>
      <stop offset="60%" stop-color="#340404"/>
      <stop offset="100%" stop-color="#1e0202"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA820A"/>
      <stop offset="100%" stop-color="#8E7C49"/>
    </linearGradient>
    <linearGradient id="silkGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer circular rim -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldShadow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>

  <!-- Celestial Crescent Moon -->
  <path d="M125 45 C80 50 65 95 85 145 C60 125 60 75 110 50 C116 47 121 46 125 45 Z" fill="url(#goldGrad)" filter="url(#goldShadow)"/>

  <!-- Delicate Stars -->
  <polygon points="140,55 142,61 148,61 143,65 145,71 140,67 135,71 137,65 132,61 138,61" fill="url(#goldGrad)"/>
  <polygon points="152,80 153,84 157,84 154,87 155,91 152,88 149,91 150,87 147,84 151,84" fill="url(#goldGrad)" opacity="0.85"/>
  <circle cx="78" cy="62" r="1.5" fill="url(#goldGrad)"/>
  <circle cx="138" cy="115" r="1.5" fill="url(#goldGrad)"/>

  <!-- Silk Ribbon Swirl Motif -->
  <path d="M75 120 Q95 105 115 118 T145 110" fill="none" stroke="url(#silkGlow)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Monogram BDS (The Bedtime Store) -->
  <text x="100" y="112" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2" filter="url(#goldShadow)">BDS</text>
  
  <!-- Est 2026 / Bahrain -->
  <text x="100" y="132" font-family="'Montserrat', 'Arial', sans-serif" font-size="7.5" font-weight="600" fill="#E8D3C6" text-anchor="middle" letter-spacing="3.5" opacity="0.95">BAHRAIN</text>
  <text x="100" y="145" font-family="'Cinzel', serif" font-size="6.5" font-weight="500" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2" opacity="0.85">EST. 2026</text>
</svg>
